<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold / Yellow gradient -->
    <linearGradient id="tbGold" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2BA38" />
      <stop offset="45%" stop-color="#EAA62D" />
      <stop offset="100%" stop-color="#DB8E18" />
    </linearGradient>
    <!-- Teal / Green-Blue gradient -->
    <linearGradient id="tbTeal" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#02A696" />
      <stop offset="100%" stop-color="#007F7F" />
    </linearGradient>
  </defs>

  <!-- Arches sweeping gracefully from left over the brand title to right -->
  <!-- 1. Top Gold Arch -->
  <path d="M 105 56 C 180 -6, 310 6, 400 95 C 345 44, 235 18, 105 56 Z" fill="url(#tbGold)" />

  <!-- 2. Middle Teal Arch -->
  <path d="M 120 60 C 190 12, 298 25, 355 86 C 312 48, 228 30, 120 60 Z" fill="url(#tbTeal)" />

  <!-- 3. Base Dark Navy Arch -->
  <path d="M 136 64 C 196 28, 272 38, 316 76 C 282 52, 225 41, 136 64 Z" fill="#0B2038" />

  <!-- Typography: TALENT BRIDGE -->
  <text x="12" y="86" font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#0B2038" letter-spacing="1.2">TALENT</text>
  <text x="12" y="132" font-family="'Plus Jakarta Sans', Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#0B2038" letter-spacing="1.2">BRIDGE</text>

  <!-- Tagline: The Right Talent, The Right Direction. -->
  <text x="14" y="158" font-family="'Plus Jakarta Sans', Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#1E293B" letter-spacing="0.2">The Right Talent, The Right Direction.</text>
</svg>
